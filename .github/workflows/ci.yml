name: CI

on:
  push:
  pull_request:

jobs:
  pure-python-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install numpy matplotlib
      - run: python -m compileall -q src/rov_mrt_sim tools
      - run: PYTHONPATH=src/rov_mrt_sim python -m unittest discover -s src/rov_mrt_sim/test -v
      - run: python tools/evaluate_results.py results/opposite_side
