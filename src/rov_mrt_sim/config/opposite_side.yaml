/**:
  ros__parameters:
    sample_time: 0.30
    vehicle_length: 3.00
    rov_offset: 1.20
    reference_speed: 0.80
    path_amplitude: 1.20
    path_wavelength: 24.0
    path_x_end: 48.0
    path_points: 961
    mrt_circle_offsets: [-0.90, 0.55, 2.00]
    mrt_circle_radius: 0.95
    rov_circle_offsets: [-0.45, 0.45]
    rov_circle_radius: 0.80

vehicle_sim_node:
  ros__parameters:
    initial_x: 0.0
    initial_y: 0.0
    initial_speed: 0.50
    initial_steering_deg: 0.0
    speed_min: 0.0
    speed_max: 1.40
    acceleration_max: 0.60
    steering_max_deg: 42.0
    steering_rate_max_deg_s: 24.0
    command_timeout: 0.75
    timeout_deceleration: 0.60

obstacle_node:
  ros__parameters:
    prediction_steps: 14
    # Repeated [x0, y0, vx, vy, radius]. Exactly two obstacles are required.
    obstacles: [14.0, -5.0, 0.0, 0.30, 0.55,
                34.0,  6.0, 0.0, -0.12, 0.55]

nmpc_avoidance_controller_node:
  ros__parameters:
    horizon: 14
    speed_min: 0.20
    speed_max: 1.40
    acceleration_max: 0.60
    steering_max_deg: 42.0
    steering_rate_max_deg_s: 24.0
    safety_padding: 0.50
    hard_margin: 0.10
    slack_max: 0.08
    obstacle_path_x: [14.0, 34.0]
    corridor_amplitude: 3.50
    corridor_lead: 8.00
    corridor_front_buffer: 0.50
    corridor_obstacle_tail: 1.50
    corridor_release: 8.00
    solver_max_iterations: 60
    solver_max_cpu_time: 0.25
    solver_tolerance: 0.0001
    acceptable_violation: 0.001
    emergency_deceleration: 0.60
    emergency_steering_gain: 2.0
